<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SimSPEND · 메인</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="main.css" />
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>
</head>
<body>
  <div class="app">
    <main class="main">

      <!-- 헤더 -->
      <header class="header">
        <div class="header__profile">
          <span class="header__avatar" id="headerAvatar">
            <!-- 아바타 SVG는 main.js에서 삽입 -->
          </span>
          <div>
            <p class="header__greeting-sub">안녕하세요,</p>
            <p class="header__greeting-main">사용자님!</p>
          </div>
        </div>
        <div class="header__actions">
          <span class="icon-btn" aria-label="알림">
            <span class="icon-btn__dot" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z" stroke="#2B2D42" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M9.5 18.5a2.5 2.5 0 0 0 5 0" stroke="#2B2D42" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="icon-btn" aria-label="마이페이지">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8.5" r="3.5" stroke="#2B2D42" stroke-width="1.8"/>
              <path d="M4.5 19.5c1.4-3.2 4.3-5 7.5-5s6.1 1.8 7.5 5" stroke="#2B2D42" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </header>

      <!-- 스트릭 카드 -->
<section class="card streak-card">
  <p class="streak__title" id="streakTitle">
    12일 연속 가계부 작성 중! 🔥
  </p>

  <p class="streak__subtitle">
    작은 습관이 큰 변화를 만들어요.
  </p>

  <div class="streak__row" id="streakRow"></div>

  <a href="add.html" class="streak__cta">
    가계부 작성하기
  </a>
</section>

      <!-- 2열 카드: 막대그래프 / 도넛 -->
      <section class="stat-row">
  <div class="card stat-card weekly-card">
    <p class="weekly-card__title">이번 주 지출 금액 요약</p>
    <div class="bar-chart" id="barChart"></div>
    <p class="stat-card__amount" id="weeklyTotal">₩0</p>
    <span class="stat-card__badge" id="weeklyDiffBadge"></span>
  </div>

  <div class="card stat-card donut-card">
    <div class="donut">
      <svg viewBox="0 0 100 100">
        <circle
          cx="50"
          cy="50"
          r="40"
          fill="none"
          stroke="#ECEDF1"
          stroke-width="14"
        />
        <circle
          id="donutRing"
          cx="50"
          cy="50"
          r="40"
          fill="none"
          stroke="#2B2D42"
          stroke-width="14"
          stroke-linecap="round"
          transform="rotate(-90 50 50)"
        />
      </svg>

      <span class="donut__value" id="donutValue">0%</span>
    </div>

    <p class="donut-card__caption">이번 주 가장 많은 지출</p>
    <p class="donut-card__category" id="topCategoryName">-</p>
  </div>
</section>

      <!-- 저축 목표 카드 -->
      <section class="card">
        <div class="goal-card__top">
          <span class="goal-card__icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2.5" width="12" height="19" rx="2.2" stroke="#FFAE00" stroke-width="1.8"/>
              <circle cx="12" cy="18" r="0.9" fill="#FFAE00"/>
            </svg>
          </span>
          <div class="goal-card__title-wrap">
            <p class="goal-card__title" id="goalTitle">아이패드 프로 구매하기</p>
            <p class="goal-card__dday" id="goalDday">D-42</p>
          </div>
          <p class="goal-card__percent" id="goalPercent">0%</p>
        </div>
        <div class="goal-progress" id="goalProgress"></div>
        <p class="goal-card__caption" id="goalCaption">목표까지 계산 중...</p>
      </section>

      <!-- 퀵메뉴 -->
      <section class="card">
        <p class="quickmenu__title">심스펜드 시작하기</p>
        <div class="quickmenu__grid" id="quickMenuGrid"></div>
      </section>

    </main>

    <!-- 하단 내비게이션 -->
<div class="image-nav">
  <img 
    src="../design/nav_bar.svg"
    alt="하단 네비게이션"
    class="image-nav__image"
  />
</div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
