<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SimSPEND · 마이페이지</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mypage.css" />
</head>
<body>
  <div class="app">
    <main class="mypage">

      <!-- 헤더 -->
      <header class="page-header">
        <a href="index.html" class="page-header__back" aria-label="뒤로가기">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 5 8 12l7 7" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <h1 class="page-header__title">마이페이지</h1>
      </header>

      <!-- 프로필 카드 -->
      <section class="card profile-card">
        <span class="profile-card__avatar" id="profileAvatar"></span>
        <div class="profile-card__info">
          <p class="profile-card__name" id="profileName">심스펜드 님</p>
          <p class="profile-card__email" id="profileEmail">hello@simspend.com</p>
        </div>
        <button type="button" class="profile-card__edit" aria-label="프로필 수정">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </section>

      <!-- 일반 설정 -->
      <section class="settings-section">
        <p class="settings-section__title">일반 설정</p>
        <div class="card settings-list">
          <div class="settings-row">
            <span class="settings-row__icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M9.5 18.5a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="settings-row__label">알림 설정</span>
            <svg class="settings-row__chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="settings-row">
            <span class="settings-row__icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="settings-row__label">다크모드 설정</span>
            <button type="button" class="toggle" id="darkModeToggle" role="switch" aria-checked="false" aria-label="다크모드 설정">
              <span class="toggle__knob"></span>
            </button>
          </div>
        </div>
      </section>

      <!-- 고객 지원 -->
      <section class="settings-section">
        <p class="settings-section__title">고객 지원</p>
        <div class="card settings-list">
          <a href="#" class="settings-row">
            <span class="settings-row__icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                <path d="M9.6 9.3a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1 .8-1 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="16.6" r="0.9" fill="currentColor"/>
              </svg>
            </span>
            <span class="settings-row__label">고객센터</span>
            <svg class="settings-row__chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="#" class="settings-row">
            <span class="settings-row__icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 4h9l3 3v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M10.6 11.3a1.4 1.4 0 1 1 2 1.3c-.5.25-.6.5-.6 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="12" cy="16" r="0.8" fill="currentColor"/>
              </svg>
            </span>
            <span class="settings-row__label">자주 묻는 질문</span>
            <svg class="settings-row__chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </section>

      <!-- 계정 관리 -->
      <section class="settings-section">
        <p class="settings-section__title">계정 관리</p>
        <div class="card settings-list">
          <a href="#" class="settings-row">
            <span class="settings-row__icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13 8l4 4-4 4M8 12h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="settings-row__label">로그아웃</span>
          </a>
          <a href="#" class="settings-row is-danger">
            <span class="settings-row__icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="9.5" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M3.5 19.5c1.2-3.3 3.5-5 6-5s4.8 1.7 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M16 11h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="settings-row__label">회원탈퇴</span>
          </a>
        </div>
      </section>

      <p class="app-version">앱 버전 1.4.2</p>
    </main>

    <!-- 하단 내비게이션 -->
    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav__item is-active">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10.5 12 4l8 6.5" stroke="#FFAE00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5" stroke="#FFAE00" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span class="bottom-nav__label">홈</span>
      </a>
      <a href="list.html" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="6" width="17" height="13" rx="2.4" stroke="#2B2D42" stroke-width="1.8"/>
          <path d="M3.5 10.5h17" stroke="#2B2D42" stroke-width="1.8"/>
          <circle cx="16.5" cy="14.3" r="1.1" fill="#2B2D42"/>
        </svg>
        <span class="bottom-nav__label">가계부</span>
      </a>
      <a href="statistics.html" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="8.5" stroke="#2F9E6E" stroke-width="1.8"/>
          <path d="M8.3 12.3 10.7 14.7 15.6 9.8" stroke="#2F9E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="bottom-nav__label">통계</span>
      </a>
      <a href="#" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="5.5" cy="12" r="1.6" fill="#8B8D9B"/>
          <circle cx="12" cy="12" r="1.6" fill="#8B8D9B"/>
          <circle cx="18.5" cy="12" r="1.6" fill="#8B8D9B"/>
        </svg>
        <span class="bottom-nav__label">더보기</span>
      </a>

      <a href="add.html" class="bottom-nav__fab" aria-label="가계부 작성하기">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 9.5 12 5l6 4.5" stroke="#2B2D42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="5.5" y="9" width="13" height="9.5" rx="2.4" stroke="#2B2D42" stroke-width="1.8"/>
          <path d="M12 12v3.4M10.3 13.7h3.4" stroke="#2B2D42" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </a>
    </nav>
  </div>

  <script src="mypage.js"></script>
</body>
</html>
